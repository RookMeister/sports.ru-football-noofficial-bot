
version: '3.3'
services:
  api:
    image: mcr.microsoft.com/playwright:focal
    container_name: api
    restart: unless-stopped
    env_file: ./.env
    working_dir: /home/node
    command: >
      /bin/bash -c "npm install --global pnpm@latest-6 && pnpm install -g typescript && pnpm install && pnpm build && pnpm start"
    volumes:
      - ./src/apps/api:/home/node
      - ./src/interfaces:/home/node/src/interfaces
      - ./src/helpers:/home/node/src/helpers
    networks:
      - app-network
  bot:
    image: node:16
    container_name: bot
    restart: unless-stopped
    env_file: ./.env
    working_dir: /home/node
    command: >
      /bin/bash -c "npm install --global pnpm@latest-6 && pnpm install -g typescript && pnpm install && pnpm build && pnpm preview"
    volumes:
      - ./src/apps/bot:/home/node
      - ./src/interfaces:/home/node/src/interfaces
      - ./src/helpers:/home/node/src/helpers
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
