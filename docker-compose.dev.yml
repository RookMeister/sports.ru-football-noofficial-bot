version: '3.3'
services:
  api:
    image: mcr.microsoft.com/playwright:focal
    container_name: api
    env_file: ./.env
    working_dir: /home/node
    command: >
      /bin/bash -c "npm install --global pnpm@latest-6 && cd ./helpers && pnpm install && cd ../apps/api/ && pnpm install && pnpm dev"
    volumes:
      - ./src/apps/api:/home/node/apps/api
      - ./src/interfaces:/home/node/interfaces
      - ./src/helpers:/home/node/helpers
    networks:
      - app-network
  bot:
    image: node:16
    container_name: bot
    env_file: ./.env
    working_dir: /home/node
    command: >
      /bin/bash -c "npm install --global pnpm@latest-6 && cd ./helpers && pnpm install && cd ../apps/bot/ && pnpm install && pnpm dev"
    volumes:
      - ./src/apps/bot:/home/node/apps/bot
      - ./src/interfaces:/home/node/interfaces
      - ./src/helpers:/home/node/helpers
    depends_on:
      - api
    networks:
      - app-network
  web:
    image: node:16
    container_name: web
    ports:
      - 80:3000
    env_file: ./.env
    working_dir: /home/node
    command: >
      /bin/bash -c "npm install --global pnpm@latest-6 && cd ./helpers && pnpm install && cd ../apps/web/ && pnpm install && pnpm dev"
    tty: true
    volumes:
      - ./src/apps/web:/home/node/apps/web
      - ./src/interfaces:/home/node/interfaces
      - ./src/helpers:/home/node/helpers
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
